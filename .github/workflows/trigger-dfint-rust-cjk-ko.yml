name: trigger-dfint-rust-cjk-ko

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  dispatch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dfint-rust-cjk-ko build
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.DFINT_RUST_CJK_KO_TOKEN }}
          TARGET_REPO: refracta/dfint-rust-cjk-ko
          TRANSLATIONS_REF: ${{ github.ref_name }}
          TRANSLATIONS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN:-}" ]]; then
            echo "DFINT_RUST_CJK_KO_TOKEN secret is required to trigger the downstream workflow." >&2
            exit 1
          fi
          API_URL="https://api.github.com"
          AUTH_HEADER="Authorization: Bearer $DISPATCH_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"

          DEFAULT_BRANCH="$(curl -fsSL -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$API_URL/repos/$TARGET_REPO" | jq -r '.default_branch')"
          if [[ -z "$DEFAULT_BRANCH" || "$DEFAULT_BRANCH" == "null" ]]; then
            echo "Failed to resolve default branch for $TARGET_REPO" >&2
            exit 1
          fi

          PAYLOAD="$(jq -n \
            --arg ref "$DEFAULT_BRANCH" \
            --arg translations_ref "$TRANSLATIONS_REF" \
            --arg translations_sha "$TRANSLATIONS_SHA" \
            '{ref:$ref, inputs:{translations_ref:$translations_ref, translations_sha:$translations_sha}}')"

          TMP_RESP="$(mktemp)"
          STATUS="$(curl -sS -o "$TMP_RESP" -w "%{http_code}" -X POST \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$API_URL/repos/$TARGET_REPO/actions/workflows/upload-build.yml/dispatches" \
            -d "$PAYLOAD")"
          if [[ "$STATUS" != "204" ]]; then
            echo "Dispatch failed (HTTP $STATUS)" >&2
            cat "$TMP_RESP" >&2
            exit 1
          fi

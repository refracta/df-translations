name: trigger-dfint-rust-cjk-ko

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  dispatch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dfint-rust-cjk-ko build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DFINT_RUST_CJK_KO_TOKEN }}
          TARGET_REPO: refracta/dfint-rust-cjk-ko
          TRANSLATIONS_REF: ${{ github.ref_name }}
          TRANSLATIONS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "DFINT_RUST_CJK_KO_TOKEN secret is required to trigger the downstream workflow." >&2
            exit 1
          fi
          DEFAULT_BRANCH="$(gh api "repos/$TARGET_REPO" --jq '.default_branch')"
          gh workflow run upload-build.yml \
            --repo "$TARGET_REPO" \
            --ref "$DEFAULT_BRANCH" \
            -f translations_ref="$TRANSLATIONS_REF" \
            -f translations_sha="$TRANSLATIONS_SHA"
